<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#008080"/>
      <stop offset="100%" style="stop-color:#006666"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="96" cy="96" r="90" fill="url(#bg)"/>
  <!-- Bike icon - simplified path -->
  <g transform="translate(96,96)" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Front wheel -->
    <circle cx="38" cy="30" r="17"/>
    <circle cx="38" cy="30" r="3" fill="white"/>
    <!-- Rear wheel -->
    <circle cx="-38" cy="30" r="17"/>
    <circle cx="-38" cy="30" r="3" fill="white"/>
    <!-- Frame -->
    <line x1="-38" y1="30" x2="0" y2="-22"/>
    <line x1="38" y1="30" x2="0" y2="-22"/>
    <line x1="-38" y1="30" x2="38" y2="30"/>
    <!-- Handlebars -->
    <line x1="0" y1="-22" x2="-8" y2="-34"/>
    <!-- Seat -->
    <line x1="0" y1="-22" x2="11" y2="-30"/>
  </g>
  <!-- CZ text -->
  <text x="96" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" letter-spacing="3">
    CZ
  </text>
</svg>
