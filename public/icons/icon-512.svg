<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#008080"/>
      <stop offset="100%" style="stop-color:#006666"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  <!-- Bike icon - simplified path -->
  <g transform="translate(256,256)" fill="none" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Front wheel -->
    <circle cx="100" cy="80" r="45"/>
    <circle cx="100" cy="80" r="8" fill="white"/>
    <!-- Rear wheel -->
    <circle cx="-100" cy="80" r="45"/>
    <circle cx="-100" cy="80" r="8" fill="white"/>
    <!-- Frame -->
    <line x1="-100" y1="80" x2="0" y2="-60"/>
    <line x1="100" y1="80" x2="0" y2="-60"/>
    <line x1="-100" y1="80" x2="100" y2="80"/>
    <!-- Handlebars -->
    <line x1="0" y1="-60" x2="-20" y2="-90"/>
    <!-- Seat -->
    <line x1="0" y1="-60" x2="30" y2="-80"/>
  </g>
  <!-- CZ text -->
  <text x="256" y="400" text-anchor="middle" font-family="Arial,sans-serif" font-size="60" font-weight="bold" fill="white" letter-spacing="8">
    CZ
  </text>
</svg>
