<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CycleZen - Offline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #008080, #006666);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .container {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      max-width: 400px;
      width: 100%;
      color: #333;
    }
    .icon {
      font-size: 4em;
      margin-bottom: 0.3em;
    }
    h1 {
      color: #008080;
      font-size: 1.8em;
      margin-bottom: 0.5em;
    }
    p {
      font-size: 1em;
      line-height: 1.6;
      margin-bottom: 1em;
    }
    a {
      color: #008080;
      text-decoration: none;
      font-weight: bold;
    }
    a:hover {
      text-decoration: underline;
    }
    .btn {
      display: inline-block;
      margin-top: 0.5em;
      padding: 12px 24px;
      background: linear-gradient(135deg, #008080, #006666);
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 128, 128, 0.4);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🚲</div>
    <h1>You're Offline</h1>
    <p>It looks like you're not connected to the internet right now.</p>
    <p>CycleZen needs a connection for features like generating new routes, but previously visited pages might still be available.</p>
    <p>Check your connection and try again.</p>
    <a href="/" class="btn">Return Home</a>
  </div>
</body>
</html>
